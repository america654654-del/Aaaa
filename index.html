<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topper Stitching - Admin Panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background: #0a0d14; color: #fff; padding: 20px; }
h1 { color: #00f2fe; text-align: center; margin-bottom: 20px; font-size: 24px; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
.container { max-width: 900px; margin: auto; }
.order-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 14px; }
.order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 10px; }
.controls-group { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
select, input[type="text"], button { padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: #16213e; color: #fff; font-size: 13px; outline: none; }
button { background: #00f2fe; color: #0a0d14; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
button:hover { opacity: 0.9; }
.btn-save { background: #2e7d32; color: #fff; }
.empty-msg { text-align: center; color: #aaa; margin-top: 40px; }
</style>
</head>
<body>

<div class="container">
  <h1>Topper Stitching Admin - Order Manager</h1>
  <div id="adminOrdersList">Loading orders...</div>
</div>

<!-- Firebase SDKs via CDN -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = { 
  apiKey: "AIzaSyDrsMo4f15JZxUk8LkNYqlYqfzEHOQ8Q4w", 
  authDomain: "toppersewingmachine.firebaseapp.com", 
  databaseURL: "https://toppersewingmachine-default-rtdb.firebaseio.com", 
  projectId: "toppersewingmachine", 
  storageBucket: "toppersewingmachine.firebasestorage.app", 
  messagingSenderId: "281176461879", 
  appId: "1:281176461879:web:97648170de01d8c975e5b2", 
  measurementId: "G-GRP6EXGE3L" 
}; 

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ordersRef = db.ref("orders");
ordersRef.on("value", snapshot => {
  const list = document.getElementById("adminOrdersList");
  list.innerHTML = "";
  if (!snapshot.exists()) {
    list.innerHTML = '<p class="empty-msg">No orders found.</p>';
    return;
  }

  const orders = [];
  snapshot.forEach(child => {
    const o = child.val();
    if(o) { o._id = child.key; orders.push(o); }
  });
  orders.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

  orders.forEach(order => {
    const card = document.createElement("div");
    card.className = "order-card";
    const currentStep = order.stepIndex || 1;
    const deliveredDateVal = order.deliveredDate || "";
    const mapLinkHtml = order.location ? `<div style="margin-top:6px"><b>📍 Map Location:</b> <a href="${order.location}" target="_blank" style="color:#00f2fe">Open Location</a></div>` : "";

    card.innerHTML = `
      <div class="order-header">
        <b>📦 ${escapeHtml(order.product || "Product")}</b>
        <span>₹${Number(order.price || 0).toLocaleString("en-IN")}</span>
      </div>
      <div><b>🆔 Order ID:</b> ${escapeHtml(order.orderId || order._id)}</div>
      <div style="margin-top:6px"><b>👤 Name:</b> ${escapeHtml(order.customerName || "")}</div>
      <div style="margin-top:6px"><b>📞 Mobile:</b> ${escapeHtml(order.customerPhone || "")}</div>
      <div style="margin-top:6px"><b>🏠 Address:</b> ${escapeHtml(order.address || "")}</div>
      <div style="margin-top:6px"><b>💳 UTR / Ref:</b> ${escapeHtml(order.utrNumber || "")}</div>
      <div style="margin-top:6px"><b>🕐 Date:</b> ${escapeHtml(order.date || "")}</div>
      ${mapLinkHtml}

      <div class="controls-group">
        <label><b>Status Step:</b></label>
        <select id="stepSelect_${order._id}">
          <option value="1" ${currentStep == 1 ? 'selected' : ''}>1. Order Placed</option>
          <option value="2" ${currentStep == 2 ? 'selected' : ''}>2. Payment Successful</option>
          <option value="3" ${currentStep == 3 ? 'selected' : ''}>3. Preparing for Delivery</option>
          <option value="4" ${currentStep == 4 ? 'selected' : ''}>4. Order Delivered</option>
          <option value="5" ${currentStep == 5 ? 'selected' : ''}>❌ Order Failed</option>
        </select>
        
        <input type="text" id="dateInput_${order._id}" placeholder="Delivered Date (dd/mm/yyyy)" value="${escapeHtml(deliveredDateVal)}" style="width:170px;">
        
        <button class="btn-save" onclick="updateOrderStatus('${order._id}')">Update Order</button>
      </div>
    `;
    list.appendChild(card);
  });
}, error => {
  document.getElementById("adminOrdersList").textContent = "Error loading orders: " + error.message;
});

function escapeHtml(value){ 
  return String(value??"") 
    .replace(/&/g,"&amp;") 
    .replace(/</g,"&lt;").replace(/>/g,"&gt;") 
    .replace(/"/g,"&quot;") 
    .replace(/'/g,"&#39;"); 
}

window.updateOrderStatus = function(orderKey) {
  const stepVal = Number(document.getElementById(`stepSelect_${orderKey}`).value);
  const dateVal = document.getElementById(`dateInput_${orderKey}`).value.trim();

  db.ref("orders/" + orderKey).update({
    stepIndex: stepVal,
    deliveredDate: dateVal
  }).then(() => {
    alert("Order status updated successfully!");
  }).catch(err => {
    alert("Failed to update: " + err.message);
  });
};
</script>
</body>
</html>
